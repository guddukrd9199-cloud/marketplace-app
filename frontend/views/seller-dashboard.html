<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Seller Dashboard - Marketplace</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div style="padding: 20px;">
    <h2>Naya Product Add Karo</h2>
    <form id="productForm" enctype="multipart/form-data">
      <input type="text" id="title" placeholder="Product Ka Naam" required><br><br>
      <textarea id="description" placeholder="Description" required></textarea><br><br>
      <input type="number" id="price" placeholder="Price (₹)" required><br><br>
      <input type="text" id="location" placeholder="Location" required><br><br>
      <label>Product Ki Photo:</label><br>
      <input type="file" id="image" accept="image/*"><br><br>
      <button type="submit">Product Add Karo</button>
    </form>

    <h2 style="margin-top: 40px;">Mere Products</h2>
    <div id="myProducts"></div>

    <h2 style="margin-top: 40px;">Mere Orders (Jo Bike Hain)</h2>
    <div id="myOrders"></div>
  </div>

  <script src="/js/navbar.js"></script>
  <script src="/js/seller-dashboard.js"></script>
</body>
</html>
